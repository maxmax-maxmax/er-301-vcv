<!DOCTYPE html>
<html>
<head><title>Panel Alignment Tool</title></head>
<body style="background:#222; margin:20px;">
<p style="color:#fff; font:13px monospace;">Cyan = widget hit areas, Green = jacks (PJ301MPort r=12.1), Yellow = LEDs. Click to log coords.</p>
<div style="position:relative; display:inline-block;">
  <canvas id="c" width="1372" height="1140" style="border:1px solid #555; cursor:crosshair;"></canvas>
  <div id="coords" style="position:absolute;top:5px;left:5px;color:#0f0;font:14px monospace;background:rgba(0,0,0,0.8);padding:4px 8px;pointer-events:none;"></div>
</div>
<script>
const S = 3; // 3x scale for precision
const PW = 457.2, PH = 380;

// ── Current C++ widget positions (from ER301Module.cpp) ──
const BTN_W = 22, BTN_H = 22;
const TOGGLE_W = 36, TOGGLE_H = 32;
const JACK_R = 12.1; // PJ301MPort radius

const mbX = [26.8, 69.8, 113.3, 156.6, 200.1, 243.5];
const mbY = 145.7, sbY = 289.1, hbY = 336.6;

const knobCX = 70.1, knobCY = 217.3, knobR = 41.0;

const mainDisp = {x:19, y:30, w:232, h:68};
const subDisp = {x:127, y:190, w:120, h:55};

const jGX=350.5, jINX=393.9, jOUTX=436.8;
const jUpperY = [50.0, 97.5, 145.4, 193.2];
const jAX=307.0, jBX=350.5, jCX=393.5, jDX=436.7;
const jABCDY = [241.5, 290.1, 337.8];

const selBtnX = 270.0;
const outLedX = 290.0;

const tStorageX=10, tStorageY=hbY-BTN_H/2;
const tModeX=95, tModeY=tStorageY;

const fineX=36, fineY=253, coarseY=265;
const ioLedX=78, ioLedY=tStorageY+9, safeLedY=tStorageY+24;

const img = new Image();
img.onload = () => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  ctx.save();
  ctx.scale(S, S);

  // Draw panel image
  ctx.drawImage(img, 0, 0, PW, PH);

  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 0.5;

  // ── Buttons (cyan rectangles) ──
  ctx.strokeStyle = '#0ff';
  function drawBtn(cx, cy) {
    ctx.strokeRect(cx - BTN_W/2, cy - BTN_H/2, BTN_W, BTN_H);
  }
  // M buttons
  for(let i=0;i<6;i++) drawBtn(mbX[i], mbY);
  // Sub buttons
  for(let i=0;i<6;i++) drawBtn(mbX[i], sbY);
  // Hard buttons
  for(let i=3;i<6;i++) drawBtn(mbX[i], hbY);
  // Select buttons
  for(let i=0;i<4;i++) drawBtn(selBtnX, jUpperY[i]);

  // ── Toggles (cyan rect) ──
  ctx.strokeRect(tStorageX, tStorageY, TOGGLE_W, TOGGLE_H);
  ctx.strokeRect(tModeX, tModeY, TOGGLE_W, TOGGLE_H);

  // ── Knob (cyan circle) ──
  ctx.beginPath();
  ctx.arc(knobCX, knobCY, knobR, 0, Math.PI*2);
  ctx.stroke();
  // crosshair at center
  ctx.beginPath();
  ctx.moveTo(knobCX-3, knobCY); ctx.lineTo(knobCX+3, knobCY);
  ctx.moveTo(knobCX, knobCY-3); ctx.lineTo(knobCX, knobCY+3);
  ctx.stroke();

  // ── Displays (red rect) ──
  ctx.strokeStyle = '#f00';
  ctx.strokeRect(mainDisp.x, mainDisp.y, mainDisp.w, mainDisp.h);
  ctx.strokeRect(subDisp.x, subDisp.y, subDisp.w, subDisp.h);

  // ── Jacks (green circles) ──
  ctx.strokeStyle = '#0f0';
  ctx.fillStyle = 'rgba(0,255,0,0.15)';
  function drawJack(x, y) {
    ctx.beginPath(); ctx.arc(x, y, JACK_R, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  // G column
  for(let i=0;i<4;i++) drawJack(jGX, jUpperY[i]);
  // IN column
  for(let i=0;i<4;i++) drawJack(jINX, jUpperY[i]);
  // OUT column
  for(let i=0;i<4;i++) drawJack(jOUTX, jUpperY[i]);
  // ABCD
  [jAX, jBX, jCX, jDX].forEach(x => {
    jABCDY.forEach(y => drawJack(x, y));
  });

  // ── LEDs (yellow dots) ──
  ctx.fillStyle = '#ff0';
  function drawLed(x, y) {
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
  }
  // Output LEDs
  for(let i=0;i<4;i++) drawLed(outLedX, jUpperY[i]);
  // Link LEDs
  for(let i=0;i<3;i++) drawLed(outLedX, (jUpperY[i]+jUpperY[i+1])/2);
  // Fine/coarse
  drawLed(fineX, fineY); drawLed(fineX, coarseY);
  // I/O, safe
  drawLed(ioLedX, ioLedY); drawLed(ioLedX, safeLedY);
  // CV LEDs (upper-left of ABCD jacks)
  [jAX,jBX,jCX,jDX].forEach(x => {
    jABCDY.forEach(y => drawLed(x-15, y-15));
  });

  ctx.restore();

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / S).toFixed(1);
    const y = ((e.clientY - rect.top) / S).toFixed(1);
    document.getElementById('coords').textContent = `VCV: x=${x}  y=${y}`;
  });
};
img.src = 'Panel.png?' + Date.now();
</script>
</body>
</html>
