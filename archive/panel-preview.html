<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ER-301 VCV Panel Preview</title>
<style>
  body { background: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; font-family: sans-serif; }
  .scale-label { color: #aaa; text-align: center; margin-bottom: 8px; font-size: 13px; }
  canvas { border: 1px solid #555; display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="scale-label">1x preview (457 x 380 px = 30HP)</div>
<canvas id="panel" width="457" height="380"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════
// ER-301 Panel — matching reference photo
// ═══════════════════════════════════════════════════════════════
const PW = 30 * 15.24; // 457.2
const PH = 380;
const RACK_GRID_WIDTH = 15.24;

// Display sizes
const MAIN_DW = 234, MAIN_DH = 58;
const SUB_DW = 117, SUB_DH = 58;

// Widget sizes
const BTN_W = 26, BTN_H = 26;
const TOGGLE_W = 38, TOGGLE_H = 34;
const KNOB_R = 42; // knob radius — smaller

const LM = 10;

// ── Horizontal layout ──
const mainDispX = LM;
const j1X = LM + MAIN_DW + 28;          // 272 — select btn / A column
const j4X = PW - 10 - 12;               // 435.2 — OUT / D column
const jackSpan = j4X - j1X;
const jHS = jackSpan / 3;
const j2X = j1X + jHS;                  // G / B column
const j3X = j2X + jHS;                  // IN / C column

// M button X positions — evenly spaced under the display
const mb1X = mainDispX;
const gridStep = (MAIN_DW - BTN_W) / 5;
const mbXs = [];
for (let i = 0; i < 6; i++) mbXs.push(mb1X + i * gridStep);

// ── Vertical layout ──
const VOS = 14;
const mainDispY = 20 + VOS - 6;          // 28
const mbY = 104 + VOS;                  // 118

// Knob — center horizontally with CANCEL button
const knobCX = mbXs[1] + BTN_W / 2;  // aligned with CANCEL button center
const knobCY = 186 + VOS;               // moved up

const subDispX = LM + MAIN_DW / 2;
const subDispY = knobCY - SUB_DH / 2;

const fineY = 226 + VOS;                // fine/coarse below knob

const sbY = 260 + VOS;                  // 274
const hbY = 316 + VOS;                  // 330

const tStorageX = LM - 1;
const tModeX = LM + 2 * gridStep - 1;

// Right panel vertical
const j1Y = 40 + VOS, j2Y = 100 + VOS, j3Y = 160 + VOS, j4Y = 220 + VOS;
const j5Y = 264 + VOS, j6Y = 305 + VOS, j7Y = 346 + VOS;

const selBtnX = j1X - BTN_W / 2;
const outLedX = (LM + MAIN_DW + selBtnX) / 2;

// ═══════════════════════════════════════════════════════════════
function drawPanel(ctx) {
  // ── Panel background ──
  ctx.fillStyle = '#e0e0e2';
  ctx.fillRect(0, 0, PW, PH);

  // Panel border
  ctx.strokeStyle = '#a0a0a2';
  ctx.lineWidth = 0.75;
  ctx.strokeRect(0.5, 0.5, PW - 1, PH - 1);

  // ── Screws ──
  drawScrew(ctx, RACK_GRID_WIDTH / 2, RACK_GRID_WIDTH / 2);
  drawScrew(ctx, PW - RACK_GRID_WIDTH / 2, RACK_GRID_WIDTH / 2);
  drawScrew(ctx, RACK_GRID_WIDTH / 2, PH - RACK_GRID_WIDTH / 2);
  drawScrew(ctx, PW - RACK_GRID_WIDTH / 2, PH - RACK_GRID_WIDTH / 2);

  // ── Title ──
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText('ER-301', PW / 2 - 40, 12);
  ctx.font = '9.5px sans-serif';
  ctx.fillStyle = '#3a3a3a';
  ctx.fillText('SOUND COMPUTER', PW / 2 + 55, 12);

  // ── Main Display bezel ──
  ctx.fillStyle = '#000';
  roundRect(ctx, mainDispX - 3, mainDispY - 3, MAIN_DW + 6, MAIN_DH + 6, 4);
  ctx.fill();
  ctx.fillStyle = '#0a0a00';
  ctx.fillRect(mainDispX, mainDispY, MAIN_DW, MAIN_DH);
  ctx.font = '9px monospace';
  ctx.fillStyle = '#cc9900';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Main Display (256x64)', mainDispX + MAIN_DW / 2, mainDispY + MAIN_DH / 2);

  // ── M1-M6 buttons ──
  drawButton(ctx, mbXs[0], mbY, BTN_W, BTN_H, 'grey', 'M1', 'QUICKSAVE');
  drawButton(ctx, mbXs[1], mbY, BTN_W, BTN_H, 'grey', 'M2', '');
  drawButton(ctx, mbXs[2], mbY, BTN_W, BTN_H, 'grey', 'M3', '');
  drawButton(ctx, mbXs[3], mbY, BTN_W, BTN_H, 'grey', 'M4', '');
  drawButton(ctx, mbXs[4], mbY, BTN_W, BTN_H, 'grey', 'M5', '');
  drawButton(ctx, mbXs[5], mbY, BTN_W, BTN_H, 'grey', 'M6', 'FOCUS');

  // ── Encoder Knob (large) ──
  drawKnob(ctx, knobCX, knobCY, KNOB_R);

  // ── Sub Display bezel ──
  ctx.fillStyle = '#000';
  roundRect(ctx, subDispX - 3, subDispY - 3, SUB_DW + 6, SUB_DH + 6, 4);
  ctx.fill();
  ctx.fillStyle = '#0a0a00';
  ctx.fillRect(subDispX, subDispY, SUB_DW, SUB_DH);
  ctx.font = '7px monospace';
  ctx.fillStyle = '#cc9900';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Sub (128x64)', subDispX + SUB_DW / 2, subDispY + SUB_DH / 2);

  // ── Fine/Coarse — bottom-left under knob ──
  const fcX = LM - 4;
  const fcY = fineY;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  // "fine" with underline + LED
  ctx.font = '7.5px sans-serif';
  ctx.fillStyle = '#1e1e1e';
  ctx.fillText('fine', fcX, fcY);
  const fineW = ctx.measureText('fine').width;
  ctx.beginPath();
  ctx.moveTo(fcX, fcY + 1.5);
  ctx.lineTo(fcX + fineW, fcY + 1.5);
  ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 0.7; ctx.stroke();
  drawLed(ctx, fcX + fineW + 6, fcY - 3, '#882222', 3);
  // ↕ below fine
  ctx.font = '9px sans-serif';
  ctx.fillStyle = '#1e1e1e';
  ctx.fillText('\u2195', fcX + 4, fcY + 10);
  // "coarse" — positioned to the right, beside ↕ arrow
  ctx.font = '7.5px sans-serif';
  ctx.fillText('coarse', fcX + 12, fcY + 14);
  const coarseW = ctx.measureText('coarse').width;
  ctx.beginPath();
  ctx.moveTo(fcX + 12, fcY + 15.5);
  ctx.lineTo(fcX + 12 + coarseW, fcY + 15.5);
  ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 0.7; ctx.stroke();
  drawLed(ctx, fcX + 12 + coarseW + 6, fcY + 11, '#882222', 3);
  // ↔ below coarse
  ctx.font = '9px sans-serif';
  ctx.fillStyle = '#1e1e1e';
  ctx.fillText('\u2194', fcX + 16, fcY + 24);

  // ── Sub buttons row ──
  // First 3 are blue, last 3 are grey
  drawButton(ctx, mbXs[0], sbY, BTN_W, BTN_H, 'blue', '', '');
  drawButton(ctx, mbXs[1], sbY, BTN_W, BTN_H, 'blue', 'CANCEL', '');
  // House icon above ZERO
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#1e1e1e';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('\u2302', mbXs[2] + BTN_W / 2, sbY - 14);
  drawButton(ctx, mbXs[2], sbY, BTN_W, BTN_H, 'blue', '', 'ZERO');
  drawButton(ctx, mbXs[3], sbY, BTN_W, BTN_H, 'grey', 'S1', '');
  drawButton(ctx, mbXs[4], sbY, BTN_W, BTN_H, 'grey', 'S2', '');
  drawButton(ctx, mbXs[5], sbY, BTN_W, BTN_H, 'grey', 'S3', 'FOCUS');

  // ── Bottom section: STORAGE | I/O safe | MODE | ENTER COMMIT | UP | SHIFT ──
  drawToggle(ctx, tStorageX, hbY, TOGGLE_W, TOGGLE_H, 'STORAGE', ['\u2191 user', '\u2022 admin', '\u2193 eject']);

  // I/O and Safe LEDs — labels on top, LEDs below
  const ioX = tStorageX + TOGGLE_W + 28;
  ctx.font = '6.5px sans-serif';
  ctx.fillStyle = '#323232';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#1e1e1e';
  ctx.fillText('I/O', ioX, hbY + 4);
  drawLed(ctx, ioX, hbY + 9, '#882222', 3);
  ctx.fillStyle = '#1e1e1e';
  ctx.fillText('safe', ioX, hbY + 19);
  drawLed(ctx, ioX, hbY + 24, '#882222', 3);

  // MODE toggle
  drawToggle(ctx, tModeX, hbY, TOGGLE_W, TOGGLE_H, 'MODE', ['\u2191 hold', '\u2022 edit', '\u2193 scope']);

  // Hard buttons — ENTER/COMMIT, ▲UP, SHIFT
  drawButton(ctx, mbXs[3], hbY, BTN_W, BTN_H, 'blue', 'ENTER', 'COMMIT');
  drawButton(ctx, mbXs[4], hbY, BTN_W, BTN_H, 'blue', '\u25B2 UP', '');
  drawButton(ctx, mbXs[5], hbY, BTN_W, BTN_H, 'blue', '', 'SHIFT');

  // ════════════════════════════════════════════════
  // RIGHT SECTION
  // ════════════════════════════════════════════════

  // ── G/IN/OUT column headers ──
  ctx.font = 'bold 9px sans-serif';
  ctx.fillStyle = '#2a2a2a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('G', j2X, j1Y - 18);
  ctx.fillText('IN', j3X, j1Y - 18);
  ctx.fillText('OUT', j4X, j1Y - 18);

  // ── Dashed vertical dividers (upper section) ──
  ctx.strokeStyle = '#a5a5a7';
  ctx.lineWidth = 0.5;
  const dTop = j1Y - 14;
  const dBot = j4Y + 18;
  const divXs = [(j1X + j2X) / 2, (j2X + j3X) / 2, (j3X + j4X) / 2];
  for (const dx of divXs) {
    drawDashedVLine(ctx, dx, dTop, dBot);
  }

  // ── Upper 4 rows: LEDs, select buttons, G/IN/OUT jacks ──
  const jYupper = [j1Y, j2Y, j3Y, j4Y];
  for (let i = 0; i < 4; i++) {
    const y = jYupper[i];
    // Output LED — first is bright red, others are gold/amber
    drawLed(ctx, outLedX, y, i === 0 ? '#ee2222' : '#ccaa00', 4);
    // Select button (grey filled with outlined number)
    drawSelectButton(ctx, selBtnX, y - BTN_H / 2, BTN_W, BTN_H, String(i + 1));
    // G jack
    drawJack(ctx, j2X, y);
    // IN jack
    drawJack(ctx, j3X, y);
    // OUT jack
    drawJack(ctx, j4X, y);
  }

  // ── Link LEDs + "linked" labels ──
  ctx.font = '6.5px sans-serif';
  ctx.fillStyle = '#3c3c3c';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) {
    const ly = (jYupper[i] + jYupper[i + 1]) / 2;
    drawLed(ctx, outLedX, ly, '#ccaa00', 3);
    ctx.fillText('linked', outLedX + 7, ly);
  }

  // ── ABCD section divider ──
  const abcdDivY = (j4Y + j5Y) / 2;
  ctx.strokeStyle = '#a5a5a7';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(j1X - 28, abcdDivY);
  ctx.lineTo(PW - 4, abcdDivY);
  ctx.stroke();

  // ── Dashed vertical dividers (ABCD section) ──
  const abcdBot = j7Y + 16;
  for (const dx of divXs) {
    drawDashedVLine(ctx, dx, abcdDivY + 4, abcdBot);
  }

  // ── CV jack labels (A1-D3) with gold LEDs ──
  const cols = ['A', 'B', 'C', 'D'];
  const cvJx = [j1X, j2X, j3X, j4X];
  const cvJy = [j5Y, j6Y, j7Y];
  ctx.font = 'bold 8px sans-serif';
  ctx.fillStyle = '#2a2a2a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 3; r++) {
      ctx.fillText(cols[c] + (r + 1), cvJx[c], cvJy[r] - 14);
      // CV LED — gold/amber
      drawLed(ctx, cvJx[c] - 15, cvJy[r] - 13, '#ccaa00', 2.5);
      // Jack
      drawJack(ctx, cvJx[c], cvJy[r]);
    }
  }

  // ── Bottom specs (disabled for now) ──
}

// ═══════════════════════════════════════════════════════════════
// DRAWING HELPERS
// ═══════════════════════════════════════════════════════════════

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawDashedVLine(ctx, x, yTop, yBot) {
  ctx.strokeStyle = '#a5a5a7';
  ctx.lineWidth = 0.5;
  for (let y = yTop; y < yBot; y += 6) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, Math.min(y + 3, yBot));
    ctx.stroke();
  }
}

function drawScrew(ctx, cx, cy) {
  const r = 5.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#c0c0c0'; ctx.fill();
  ctx.strokeStyle = '#999'; ctx.lineWidth = 0.5; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 2.5, cy); ctx.lineTo(cx + 2.5, cy);
  ctx.moveTo(cx, cy - 2.5); ctx.lineTo(cx, cy + 2.5);
  ctx.strokeStyle = '#888'; ctx.lineWidth = 0.8; ctx.stroke();
}

function drawButton(ctx, x, y, w, h, color, label, pill) {
  // Pill sits just above the button
  if (pill) {
    ctx.font = '6px sans-serif';
    const tw = ctx.measureText(pill).width;
    const pw = tw + 8, ph = 10;
    const px = x + w / 2 - pw / 2, py = y - 13;
    roundRect(ctx, px, py, pw, ph, 4);
    ctx.strokeStyle = '#505050';
    ctx.lineWidth = 0.75;
    ctx.stroke();
    ctx.fillStyle = '#3c3c3c';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pill, x + w / 2, py + ph / 2 + 0.5);
  }
  // Label sits above the pill (or above button if no pill)
  if (label) {
    const labelY = pill ? y - 17 : y - 3;
    ctx.font = '8px sans-serif';
    ctx.fillStyle = '#1e1e1e';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(label, x + w / 2, labelY);
  }
  // Button face
  let face;
  if (color === 'blue') face = '#3a6acc';
  else face = '#6a6a6c'; // lighter grey matching reference
  roundRect(ctx, x, y, w, h, 2);
  ctx.fillStyle = face;
  ctx.fill();
  // Highlight
  ctx.fillStyle = color === 'blue' ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.10)';
  ctx.fillRect(x + 1, y + 1, w - 2, 1.5);
  // Border
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 0.75;
  roundRect(ctx, x, y, w, h, 2);
  ctx.stroke();
}

function drawSelectButton(ctx, x, y, w, h, num) {
  // Grey filled button with number (matching reference)
  roundRect(ctx, x, y, w, h, 2);
  ctx.fillStyle = '#7a7a7c';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.75;
  roundRect(ctx, x, y, w, h, 2);
  ctx.stroke();
  // Number inside with outline style
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#2a2a2a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 0.5;
  ctx.strokeText(num, x + w / 2, y + h / 2);
}

function drawJack(ctx, cx, cy) {
  // Outer metallic ring
  ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2);
  const jGrad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 11);
  jGrad.addColorStop(0, '#ccc');
  jGrad.addColorStop(0.5, '#aaa');
  jGrad.addColorStop(1, '#888');
  ctx.fillStyle = jGrad;
  ctx.fill();
  ctx.strokeStyle = '#666'; ctx.lineWidth = 0.5; ctx.stroke();
  // Gold contact ring
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#8a7a30'; ctx.fill();
  // Gold contact lines (visible pin contacts)
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    ctx.beginPath();
    ctx.moveTo(cx + 4 * Math.cos(a), cy + 4 * Math.sin(a));
    ctx.lineTo(cx + 6.5 * Math.cos(a), cy + 6.5 * Math.sin(a));
    ctx.strokeStyle = '#b0a040';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // Inner hole
  ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = '#111'; ctx.fill();
}

function drawKnob(ctx, cx, cy, r) {
  // ── Outer shadow ring (very subtle) ──
  ctx.beginPath(); ctx.arc(cx, cy + 1, r + 1, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fill();

  // ── Outer black bezel ──
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a1a'; ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ── Rubber grip band — top-lit for volume ──
  const gripR = r - 2;
  const bandGrad = ctx.createLinearGradient(cx, cy - gripR, cx, cy + gripR);
  bandGrad.addColorStop(0, '#555');
  bandGrad.addColorStop(0.3, '#3a3a3a');
  bandGrad.addColorStop(0.6, '#222');
  bandGrad.addColorStop(1, '#111');
  ctx.beginPath(); ctx.arc(cx, cy, gripR, 0, Math.PI * 2);
  ctx.fillStyle = bandGrad; ctx.fill();

  // Subtle ridges on the grip (soft, not sharp)
  const nRidges = 50;
  const ridgeInner = gripR - 6;
  for (let i = 0; i < nRidges; i++) {
    const a = (i / nRidges) * 2 * Math.PI;
    // Alternating light/dark for soft knurl feel
    const lightVal = -Math.sin(a) * 0.4 - Math.cos(a) * 0.2;
    ctx.beginPath();
    ctx.moveTo(cx + ridgeInner * Math.cos(a), cy + ridgeInner * Math.sin(a));
    ctx.lineTo(cx + gripR * Math.cos(a), cy + gripR * Math.sin(a));
    ctx.strokeStyle = lightVal > 0
      ? `rgba(255,255,255,${lightVal * 0.08})`
      : `rgba(0,0,0,${-lightVal * 0.12})`;
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }

  // ── Recessed groove ring ──
  ctx.beginPath(); ctx.arc(cx, cy, ridgeInner - 1, 0, Math.PI * 2);
  ctx.strokeStyle = '#0e0e0e';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // ── Inner face — raised plateau with strong top-down lighting ──
  const faceR = ridgeInner - 3;
  const fGrad = ctx.createLinearGradient(cx, cy - faceR, cx, cy + faceR);
  fGrad.addColorStop(0, '#555');
  fGrad.addColorStop(0.2, '#444');
  fGrad.addColorStop(0.5, '#2a2a2a');
  fGrad.addColorStop(1, '#1e1e1e');
  ctx.beginPath(); ctx.arc(cx, cy, faceR, 0, Math.PI * 2);
  ctx.fillStyle = fGrad; ctx.fill();

  // ── Textured sides — fine radial ridges around the face edge ──
  const texOuter = faceR;
  const texInner = faceR * 0.5;
  const nTex = 72;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, faceR, 0, Math.PI * 2);
  ctx.clip();
  for (let i = 0; i < nTex; i++) {
    const a = (i / nTex) * 2 * Math.PI;
    const lightVal = -Math.sin(a) * 0.5 - Math.cos(a) * 0.25;
    ctx.beginPath();
    ctx.moveTo(cx + texInner * Math.cos(a), cy + texInner * Math.sin(a));
    ctx.lineTo(cx + texOuter * Math.cos(a), cy + texOuter * Math.sin(a));
    ctx.strokeStyle = lightVal > 0
      ? `rgba(255,255,255,${lightVal * 0.07})`
      : `rgba(0,0,0,${-lightVal * 0.09})`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  ctx.restore();
}

function drawLed(ctx, cx, cy, color, r) {
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.7; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 0.4; ctx.stroke();
}

function drawToggle(ctx, x, y, w, h, title, labels) {
  // Title
  ctx.font = '7.5px sans-serif';
  ctx.fillStyle = '#1e1e1e';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(title, x, y - 3);
  // Lever slot (thin dark line)
  const cx = x + 7, tH = h - 8, tTop = y + 4;
  ctx.beginPath();
  ctx.moveTo(cx, tTop + 2);
  ctx.lineTo(cx, tTop + tH - 2);
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Lever (middle position)
  const leverLen = tH * 0.45;
  const leverCy = tTop + tH * 0.5;
  const leverTop = leverCy - leverLen / 2;
  roundRect(ctx, cx - 3, leverTop, 6, leverLen, 2);
  const lgr = ctx.createLinearGradient(cx - 3, leverTop, cx + 3, leverTop + leverLen);
  lgr.addColorStop(0, '#d2d2d4');
  lgr.addColorStop(1, '#a0a0a2');
  ctx.fillStyle = lgr; ctx.fill();
  ctx.strokeStyle = '#646464'; ctx.lineWidth = 0.5;
  roundRect(ctx, cx - 3, leverTop, 6, leverLen, 2); ctx.stroke();
  // Labels
  const textX = x + 13;
  const positions = [tTop + tH * 0.22, tTop + tH * 0.5, tTop + tH * 0.78];
  ctx.font = '6.5px sans-serif';
  ctx.fillStyle = '#323232';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) ctx.fillText(labels[i], textX, positions[i]);
}

// Render
drawPanel(document.getElementById('panel').getContext('2d'));
</script>
</body>
